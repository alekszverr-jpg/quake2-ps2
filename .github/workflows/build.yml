name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PS2DEV: /tmp/ps2dev
      PS2SDK: /tmp/ps2dev/ps2sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make git wget bzip2 pkg-config curl cmake

      - name: Check VRAM allocator on host
        run: |
          g++ -std=c++17 -DPS2_PROFILE=1 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Itests/vram/stubs -Isrc tests/vram/test.cpp -o /tmp/quake2-vram-test
          /tmp/quake2-vram-test

      - name: Check segmented BSP allocation on host
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Itests/vram/stubs -Isrc tests/world_hunk/test.cpp -o /tmp/quake2-world-hunk-test
          /tmp/quake2-world-hunk-test

      - name: Check TGA output formats on host
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Itests/image_load/stubs -Itests/vram/stubs -Isrc tests/image_load/test.cpp -o /tmp/quake2-image-test
          /tmp/quake2-image-test

      - name: Check demo benchmark coordinator on host
        run: |
          python3 tests/benchmark/run.py

      - name: Check indexed MD2 clipping against generic clipper
        run: python3 tests/alias_clip/run.py

      - name: Check MD2 diagnostic phase accounting on host
        run: python3 tests/model_profile/run.py

      - name: Check distant static-light subdivision on host
        run: python3 tests/lighting_lod/run.py

      - name: Check retained BSP seal corner indices on host
        run: python3 tests/seal_corners/run.py

      - name: Check bounded BSP lighting-cache reuse on host
        run: python3 tests/lighting_cache/run.py

      - name: Check bounded VRAM gameplay capture on host
        run: python3 tests/vram_capture/run.py

      - name: Check exclusive full-frame capture on host
        run: python3 tests/frame_capture/run.py

      - name: Check VIDEO controls and output mode scaling on host
        run: python3 tests/video_menu/run.py

      - name: Check pre-BSP level purge on host
        run: python3 tests/level_purge/run.py

      - name: Check transition filesystem and sound purge on host
        run: python3 tests/transition_io/run.py

      - name: Check memory-pressure cache reclamation on host
        run: python3 tests/memory_reclaim/run.py

      - name: Check underwater view, beams and dynamic world lighting on host
        run: python3 tests/view_effects/run.py

      - name: Check VU transparency packet and sprite submission on host
        run: python3 tests/transparency/run.py

      - name: Build and validate original flowing-surface test map
        run: |
          python3 tools/effect_map.py build/effect-map/quake2/baseq2
          git init build/effect-map-tools
          git -C build/effect-map-tools fetch --depth 1 https://github.com/yquake2/maptools.git 9b7e43334646f63f25a7aebfd62070b3aebc2554
          git -C build/effect-map-tools checkout --detach FETCH_HEAD
          python3 tools/prepare_maptools.py build/effect-map-tools
          make -C build/effect-map-tools -j2 release/qbsp3 release/qvis3 release/qrad3 CFLAGS="-O2 -fcommon -fno-strict-aliasing -Wall -MMD"
          build/effect-map-tools/release/qbsp3 -leaktest "$PWD/build/effect-map/quake2/baseq2/maps/ps2flow.map"
          build/effect-map-tools/release/qvis3 "$PWD/build/effect-map/quake2/baseq2/maps/ps2flow.bsp"
          build/effect-map-tools/release/qrad3 -threads 1 -bounce 0 -ambient 0.2 "$PWD/build/effect-map/quake2/baseq2/maps/ps2flow.bsp"
          python3 tools/effect_map.py build/effect-map/quake2/baseq2 --verify

      - name: Upload flowing-surface test map
        uses: actions/upload-artifact@v4
        with:
          name: ps2flow-test-map
          path: |
            build/effect-map/quake2/baseq2/maps/ps2flow.bsp
            build/effect-map/quake2/baseq2/maps/ps2flow.map
            build/effect-map/quake2/baseq2/textures/ps2test/*.wal
            build/effect-map/quake2/baseq2/models/ps2test/*
            build/effect-map/quake2/baseq2/sprites/ps2test/*

      - name: Download PS2DEV prebuilt toolchain
        run: |
          mkdir -p "$PS2DEV"
          curl -L -o /tmp/ps2dev-ubuntu-latest.tar.gz \
            https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz
          tar -xzf /tmp/ps2dev-ubuntu-latest.tar.gz --strip-components=1 -C "$PS2DEV"
          ls -la "$PS2DEV"
          ls -la "$PS2SDK"

      - name: Build missing PS2 VCL tools
        run: |
          cd /tmp
          rm -rf vclpp openvcl
          git clone --depth 1 --recurse-submodules https://github.com/glampert/vclpp.git
          cd vclpp
          make
          install -Dm755 vclpp "$PS2DEV/bin/vclpp"

          cd /tmp
          git clone --depth 1 https://github.com/ps2dev/openvcl.git
          cd openvcl
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX="$PS2DEV" \
            -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build build --parallel
          cmake --install build

          "$PS2DEV/bin/vclpp" --help
          "$PS2DEV/bin/openvcl" -h

      - name: Show repository structure
        run: |
          ls -la
          find . -maxdepth 2 -type f | sed 's#^./##' | sort | head -200

      - name: Build PS2 profile ELF
        run: |
          export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"
          set +e
          make BUILD=profile 2>&1 | tee build-profile.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            grep -E '(^|: )(fatal )?error:' build-profile.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$build_status"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quake2-ps2-build
          path: build/quake2-profile.elf
